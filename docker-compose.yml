services:
  db:
    image: postgis/postgis:16-3.4
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-discgolf}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-discgolf}
      POSTGRES_DB: ${POSTGRES_DB:-discgolf}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - discgolf_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-discgolf}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  discgolf_pgdata:
